name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests unitaires (domaine + Android/Robolectric)
        run: ./gradlew :domain:test :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: APK de débogage
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-tests
          path: |
            domain/build/reports/tests
            app/build/reports
      - uses: actions/upload-artifact@v4
        with:
          name: cardiosuivi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
